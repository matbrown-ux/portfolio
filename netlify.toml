[build]
  command = "npm run build"
  publish = "dist"

# Netlify does not know the .webmanifest extension and would serve it as a download.
[[headers]]
  for = "/site.webmanifest"
  [headers.values]
    Content-Type = "application/manifest+json"

# The Netlify address answers with the same site; send it to the domain so there is one address
# to index and share. Deploy previews have their own host names and are not affected.
[[redirects]]
  from = "https://mat-brown-ux-portfolio.netlify.app/*"
  to = "https://matbrown.io/:splat"
  status = 301
  force = true

# Astro names the sitemap sitemap-index.xml; forward the address people and SEO tools try first.
[[redirects]]
  from = "/sitemap.xml"
  to = "/sitemap-index.xml"
  status = 301
